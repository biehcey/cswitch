<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">cswitch</title>
  <desc id="desc">cswitch — run multiple Claude Code accounts on one machine</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14111f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d16bf2"/>
      <stop offset="0.5" stop-color="#6b8cff"/>
      <stop offset="1" stop-color="#3fd7e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- Wordmark -->
    <g transform="translate(80 0)">
      <circle cx="14" cy="128" r="10" fill="#d16bf2"/>
      <circle cx="40" cy="128" r="10" fill="#6b8cff"/>
      <circle cx="66" cy="128" r="10" fill="#3fd7e6"/>
      <text x="0" y="216" font-size="92" font-weight="700" fill="url(#brand)" letter-spacing="-2">cswitch</text>
      <text x="2" y="264" font-size="24" fill="#a8b0c4">Stop logging in and out.</text>
      <text x="2" y="296" font-size="24" fill="#a8b0c4">Each folder runs its own Claude account.</text>
    </g>

    <!-- Terminal window -->
    <g transform="translate(700 52)">
      <rect width="500" height="256" rx="14" fill="#0a0d16" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
      <circle cx="44" cy="22" r="6" fill="#febc2e"/>
      <circle cx="64" cy="22" r="6" fill="#28c840"/>
      <line x1="0" y1="44" x2="500" y2="44" stroke="#ffffff" stroke-opacity="0.07"/>

      <g font-size="17">
        <text x="24" y="80" fill="#6b7280">~/work/api</text>
        <text x="24" y="106"><tspan fill="#3fd7e6">$</tspan><tspan fill="#e5e7eb"> claude</tspan></text>
        <text x="24" y="132"><tspan fill="#6b7280">cswitch:</tspan><tspan fill="#6b8cff"> ●</tspan><tspan fill="#e5e7eb"> work</tspan><tspan fill="#6b7280"> · you@company.com</tspan></text>

        <text x="24" y="176" fill="#6b7280">~/side-project</text>
        <text x="24" y="202"><tspan fill="#3fd7e6">$</tspan><tspan fill="#e5e7eb"> claude</tspan></text>
        <text x="24" y="228"><tspan fill="#6b7280">cswitch:</tspan><tspan fill="#d16bf2"> ●</tspan><tspan fill="#e5e7eb"> personal</tspan><tspan fill="#6b7280"> · me@gmail.com</tspan></text>
      </g>
    </g>
  </g>
</svg>
